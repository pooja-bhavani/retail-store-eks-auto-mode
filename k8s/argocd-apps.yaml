apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pooja-bhavani/retail-store-sample-app
    targetRevision: main
    path: src/ui/chart
    helm:
      valueFiles:
        - values.yaml
      valuesObject:
        ingresses: []
      parameters:
        - name: certManager.createClusterIssuer
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
